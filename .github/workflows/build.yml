name: Build

on:
  workflow_call:
    inputs:
      node_version:
        required: true
        type: number
        default: 22
      PUBLIC_API_URL:
        required: true
        type: string
        default: https://api.arthurplazanet.com
      pnpm_version:
        required: true
        type: number
        default: 10

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
        with:
          node_version: ${{ inputs.node_version }}
          pnpm_version: ${{ inputs.pnpm_version }}
          cache: 'pnpm'

      - name: Sync types
        run: node scripts/sync-types.mjs

      - name: Create .env
        run: |
          touch .env
          cp .env.ci .env
          cat .env

      - name: Build code
        run: PUBLIC_API_URL=${{inputs.PUBLIC_API_URL}} pnpm build

      - name: Upload-artifact if will deploy
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: website-build
          path: ./dist/
